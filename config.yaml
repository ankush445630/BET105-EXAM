# --- Change these to reconfigure the experiment ------------------------------
# n         : range to sample from is 1..n (true mean = (n+1)/2)
# k_values  : sample sizes to test — each becomes one box on the plot
# reps      : how many times to repeat the sampling per k
#             (more reps -> smoother boxes)
#
# To add a k=5000 box, just append 5000 to k_values.
# To test the range 1..2000, set n: 2000.
# -----------------------------------------------------------------------------

n: 1000

k_values:
  - 5
  - 10
  - 25
  - 50
  - 100
  - 200
  - 1000
  - 2000

reps: 100
